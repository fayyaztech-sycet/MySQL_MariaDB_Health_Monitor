<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MySQL Profiler{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        /* Tailwind CDN + plotly need body to never be white-on-white. */
        body { background-color: #0f172a; color: #e2e8f0; }
        .tw-prose table th { color: #94a3b8; }
    </style>
</head>
<body class="min-h-screen antialiased">
<nav class="sticky top-0 z-10 bg-slate-900/95 border-b border-slate-800 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex flex-wrap items-center gap-x-5 gap-y-2 py-3">
            <span class="font-bold text-indigo-400 text-lg">🖥 MySQL Profiler</span>
            <div class="flex flex-wrap items-center gap-x-1 gap-y-1 ml-auto">
                <a href="/" class="px-3 py-1.5 rounded-md text-sm font-medium {% if request.url.path == '/' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %}">Dashboard</a>
                <a href="/logs" class="px-3 py-1.5 rounded-md text-sm font-medium {% if request.url.path == '/logs' %}bg-indigo-600 text-white{% else %}text-slate-300 hover:bg-slate-800{% endif %}">Logs</a>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
</main>

<footer class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-slate-500">
    MySQL Performance Monitoring &amp; Query Intelligence Platform
</footer>
</body>
</html>
