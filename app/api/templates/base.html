<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MySQL Profiler{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; }
        nav { display: flex; gap: 1rem; padding: .8rem 1.2rem; background: #1f2937;
              align-items: center; }
        nav a { color: #e5e7eb; text-decoration: none; font-weight: 600; }
        nav a:hover { color: #fff; }
        nav .brand { font-size: 1.1rem; }
        .container { max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        .card { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .card .label { font-size: .8rem; color: #6b7280; }
        .card .value { font-size: 1.5rem; font-weight: 700; margin-top: .2rem; }
        .panel { background: #fff; border-radius: 8px; padding: 1rem; margin-top: 1.5rem;
                 box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid #eee; }
        th { color: #6b7280; font-weight: 600; }
        .severity-critical { color: #dc2626; } .severity-warning { color: #d97706; }
        .severity-info { color: #2563eb; }
        .mono { font-family: ui-monospace, monospace; font-size: .8rem; }
        footer { text-align: center; color: #9ca3af; font-size: .8rem; padding: 1.5rem; }
    </style>
</head>
<body>
<nav>
    <span class="brand">🖥 MySQL Profiler</span>
    <a href="/">Overview</a>
    <a href="/dashboard/queries">Queries</a>
    <a href="/dashboard/health">Server Health</a>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
<footer>MySQL Performance Monitoring &amp; Query Intelligence Platform</footer>
</body>
</html>
