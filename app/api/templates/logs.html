{% extends "base.html" %}
{% block title %}Logs — MySQL Profiler{% endblock %}
{% block content %}
<h2 class="text-xl font-bold text-slate-100 mb-4">Alerts &amp; Logs</h2>

<!-- Filters -->
<div class="rounded-lg bg-slate-800/70 border border-slate-700 p-4 mb-6">
    <div class="flex flex-wrap items-end gap-3">
        <div>
            <label class="block text-xs text-slate-400 mb-1">From</label>
            <input type="date" id="from" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">To</label>
            <input type="date" id="to" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200">
        </div>
        <button id="apply" class="px-4 py-2 rounded text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-500">Apply Range</button>
        <button id="live-btn" class="px-4 py-2 rounded text-sm font-medium bg-emerald-600 text-white hover:bg-emerald-500 ml-auto">● Live</button>
    </div>
</div>

<!-- Alert summary chart -->
<div class="rounded-lg bg-slate-800/70 border border-slate-700 p-3 mb-6">
    <h3 class="text-xs font-semibold text-slate-300 mb-1">Alerts per Day</h3>
    <div id="summary-chart" class="w-full h-56"></div>
</div>

<!-- Alerts table -->
<div class="rounded-lg bg-slate-800/70 border border-slate-700 p-4">
    <h3 class="text-sm font-semibold text-slate-200 mb-3">Log Entries <span id="count" class="text-slate-500 font-normal text-xs"></span></h3>
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead><tr class="text-left text-slate-400">
                <th class="py-2 pr-3 font-medium">Time</th><th class="py-2 pr-3 font-medium">Severity</th>
                <th class="py-2 pr-3 font-medium">Type</th><th class="py-2 font-medium">Message</th>
            </tr></thead>
            <tbody id="alerts-body">
                <tr><td colspan="4" class="py-6 text-center text-slate-500">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const SEV_COLOR = { critical: '#f43f5e', warning: '#f59e0b', info: '#0ea5e9' };
const LAYOUT = { paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: '#94a3b8' }, margin: { l: 40, r: 10, t: 10, b: 30 },
    xaxis: { showgrid: false, zeroline: false },
    yaxis: { showgrid: true, gridcolor: 'rgba(148,163,184,0.15)', zeroline: false } };
const CONFIG = { displayModeBar: false, responsive: true };
let live = true;
let liveTimer = null;

function rangeParams() {
    const f = document.getElementById('from').value;
    const t = document.getElementById('to').value;
    const p = new URLSearchParams();
    if (f) p.set('from', f);
    if (t) p.set('to', t);
    return p.toString();
}

function renderTable(alerts) {
    const body = document.getElementById('alerts-body');
    document.getElementById('count').textContent = `(${alerts.length})`;
    if (!alerts.length) {
        body.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-500">No alerts in this range.</td></tr>';
        return;
    }
    body.innerHTML = alerts.map(a => `
        <tr class="border-t border-slate-700">
            <td class="py-2 pr-3 text-slate-400 whitespace-nowrap">${new Date(a.created_at).toLocaleString()}</td>
            <td class="py-2 pr-3 capitalize" style="color:${SEV_COLOR[a.severity] || '#e2e8f0'}">${a.severity}</td>
            <td class="py-2 pr-3 text-slate-300">${a.type}</td>
            <td class="py-2 text-slate-300">${a.message}</td>
        </tr>`).join('');
}

function renderSummary(rows) {
    const days = [...new Set(rows.map(r => r.day))].sort();
    const data = ['critical', 'warning', 'info'].filter(s => rows.some(r => r.severity === s)).map(s => ({
        x: days, y: days.map(d => (rows.find(r => r.day === d && r.severity === s) || {}).count || 0),
        type: 'bar', name: s, marker: { color: SEV_COLOR[s] },
    }));
    Plotly.react('summary-chart', data, Object.assign({}, LAYOUT, { barmode: 'stack' }), CONFIG);
}

async function fetchAlerts() {
    const params = live ? '' : rangeParams();
    const [alerts, summary] = await Promise.all([
        fetch('/api/alerts' + (params ? '?' + params : '')).then(r => r.json()),
        fetch('/api/alerts/summary' + (params ? '?' + params : '')).then(r => r.json()),
    ]);
    renderTable(alerts);
    renderSummary(summary);
}

function setLive(on) {
    live = on;
    const btn = document.getElementById('live-btn');
    btn.className = 'px-4 py-2 rounded text-sm font-medium ml-auto ' +
        (on ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-slate-600 text-slate-200 hover:bg-slate-500');
    btn.textContent = on ? '● Live' : '○ Paused';
    document.getElementById('from').disabled = on;
    document.getElementById('to').disabled = on;
    document.getElementById('apply').disabled = on;
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    if (on) { liveTimer = setInterval(fetchAlerts, 5000); }
    fetchAlerts();
}

document.getElementById('apply').addEventListener('click', () => setLive(false));
document.getElementById('live-btn').addEventListener('click', () => setLive(true));
setLive(true);
</script>
{% endblock %}
