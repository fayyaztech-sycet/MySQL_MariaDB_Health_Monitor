[project]
name = "mysql-profiler"
version = "0.1.0"
description = "MySQL Performance Monitoring & Query Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "mysql-connector-python>=9.0",
    "psutil>=6.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
